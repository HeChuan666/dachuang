<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <title>北京邮电大学</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .topbar {
      background-color: #003366;
      color: white;
      padding: 10px;
      text-align: center;

      color: white;
      text-decoration: none;
      margin: 0 15px;

      text-align: center;
      margin: 20px;
    }

    .search-bar input {
      padding: 10px;
      width: 300px;
    }

    .search-bar button {
      padding: 10px 20px;
      background-color: #003366;
      color: white;
      border: none;
      cursor: pointer;
    }

    .middlebar {
      background-color: #f1f1f1;
      padding: 20px;
      text-align: center;
    }

    .middlebar button {
      margin: 10px;
      padding: 10px 20px;
      background-color: #003366;

<body>
  <div class="topbar">

    document.getElementById('personal-center-btn').addEventListener('click', function () {
      window.location.href = 'login_register.html';
    });
