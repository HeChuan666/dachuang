<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北京邮电大学</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .topbar {
      background-color: #003366;
      color: white;
      padding: 10px;
      text-align: center;
    }

    .topbar a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
    }

    .search-bar {
      text-align: center;
      margin: 20px;
    }

    .search-bar input {
      padding: 10px;
      width: 300px;
    }

    .search-bar button {
      padding: 10px 20px;
      background-color: #003366;
      color: white;
      border: none;
      cursor: pointer;
    }

    .middlebar {
      background-color: #f1f1f1;
      padding: 20px;
      text-align: center;
    }

    .middlebar button {
      margin: 10px;
      padding: 10px 20px;
      background-color: #003366;
      color: white;
      border: none;
      cursor: pointer;
    }

    .content {
      padding: 20px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <a href="#">首页</a>
    <a href="#">中心概况</a>
    <a href="#">专利信息</a>
    <a href="#">专利数据</a>
    <a href="#">资源工具</a>
    <a href="#">科研服务</a>
    <a href="#">社会服务</a>
    <button>项目对接</button>
    <button>中文检索</button>
    <button id="personal-center-btn">个人中心</button>
  </div>
  <div class="search-bar">
    <input type="text" placeholder="请输入你要搜索的内容">
    <button>检索</button>
  </div>

  <div class="middlebar">
    <button>典型案例</button>
    <button>专利导航</button>
    <button>专利专题库科技查新</button>
    <button>图书馆</button>
    <button>期刊导航</button>
    <button>成果导航</button>
    <button>研究报告</button>
    <button>知产学堂</button>
    <button>资源工具</button>
  </div>

  <div class="content">
    <h1>北京邮电大学</h1>
    <p>Beijing University of Posts and Telecommunications</p>
  </div>

  <!-- 注册表单 -->
  <div id="register-form-container">
    <h2>注册</h2>
    <form id="register-form">
      <input type="text" name="username" placeholder="用户名" required>
      <input type="password" name="password" placeholder="密码" required>
      <input type="email" name="email" placeholder="邮箱">
      <input type="text" name="user_pic" placeholder="用户头像链接">
      <button type="submit">注册</button>
    </form>
  </div>

  <!-- 登录表单 -->
  <div id="login-form-container">
    <h2>登录</h2>
    <form id="login-form">
      <input type="text" name="username" placeholder="用户名" required>
      <input type="password" name="password" placeholder="密码" required>
      <button type="submit">登录</button>
    </form>
  </div>

  <script>
    //注册
    document.getElementById('register-form').addEventListener('submit', function (event) {
      event.preventDefault(); // 阻止默认提交行为

      const formData = new FormData(this); // 获取表单数据
      const params = new URLSearchParams();

      // 将表单数据添加到 URLSearchParams 对象中
      for (const [key, value] of formData.entries()) {
        params.append(key, value);
      }

      console.log('注册数据:', Object.fromEntries(formData.entries()));

      fetch('http://127.0.0.1:3007/api/reguser', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
        },
        body: params.toString() // 将 URLSearchParams 对象转换为字符串
      })
        .then(response => response.json())
        .then(data => {
          if (data.status === 0) {
            alert('注册成功！');
            window.location.href = '/login'; // 跳转到登录页面
          } else {
            alert('注册失败：' + data.message);
          }
        })
        .catch(error => {
          console.error('注册失败:', error);
          alert('注册失败：' + error.message);
        });
    });
    //登录
    document.getElementById('login-form').addEventListener('submit', function (event) {
      event.preventDefault(); // 阻止默认提交行为

      const formData = new FormData(this); // 获取表单数据
      const params = new URLSearchParams();

      // 将表单数据添加到 URLSearchParams 对象中
      for (const [key, value] of formData.entries()) {
        params.append(key, value);
      }

      console.log('登录数据:', Object.fromEntries(formData.entries()));

      fetch('http://127.0.0.1:3007/api/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
        },
        body: params.toString() // 将 URLSearchParams 对象转换为字符串
      })
        .then(response => response.json())
        .then(data => {
          // 处理登录成功后的逻辑，比如保存token并跳转到个人中心
          if (data.status === 0) {
            localStorage.setItem('token', data.token);
            alert('登录成功！');
            // 跳转到个人中心页面
            window.location.href = '/personal-center';
          } else {
            alert('登录失败：' + data.message);
          }
        })
        .catch(error => {
          console.error('登录失败:', error);
          // 处理登录失败后的逻辑
          alert('登录失败：' + error.message);
        });
    });

  </script>
</body>

</html>
